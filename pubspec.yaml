name: bloodbond_bangladesh
description: "BloodBond Bangladesh — National Blood Donation Mobile Platform"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Supabase Backend
  supabase_flutter: ^2.5.6

  # Security & Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Maps & PostGIS Location
  flutter_map: ^7.0.1
  latlong2: ^0.9.1
  geolocator: ^12.0.0

  # Digital Donor ID & QR
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1

  # Push Notifications
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.1
  flutter_local_notifications: ^17.2.1

  # UI, Icons, Typography & Utilities
  google_fonts: ^6.2.1
  intl: ^0.20.3
  uuid: ^4.4.0
  url_launcher: ^6.3.0
  cached_network_image: ^3.3.1
  flutter_spinkit: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
